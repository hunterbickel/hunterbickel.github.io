<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Placeholder for a photograph of London">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b4a72"/>
      <stop offset="100%" stop-color="#0f3555"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <g fill="#0b2942" opacity="0.85">
    <rect x="40"  y="380" width="70"  height="220"/>
    <rect x="120" y="330" width="55"  height="270"/>
    <rect x="185" y="410" width="80"  height="190"/>
    <!-- a nod to the Elizabeth Tower -->
    <rect x="300" y="250" width="46"  height="350"/>
    <rect x="294" y="228" width="58"  height="26"/>
    <polygon points="323,180 352,228 294,228"/>
    <rect x="370" y="360" width="90"  height="240"/>
    <!-- and the Gherkin -->
    <path d="M520 600 q-26 -150 26 -230 q52 80 26 230 z"/>
    <rect x="600" y="330" width="60"  height="270"/>
    <rect x="670" y="400" width="90"  height="200"/>
  </g>
  <rect x="0" y="560" width="800" height="40" fill="#0a2337" opacity="0.6"/>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="400" y="122" font-size="30" font-weight="700" letter-spacing="5"
          fill="#ffffff" opacity="0.92">LONDON</text>
    <text x="400" y="156" font-size="16" letter-spacing="2.4"
          fill="#9fc4e2" opacity="0.9">PHOTO TO COME</text>
  </g>
</svg>
